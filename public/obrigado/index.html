<script>
// Fallback inteligente para imagens e conexões móveis (zero broken images)
(function(){
  function fixImg(img) {
    if (!img || img.dataset.fbApplied) return;
    img.dataset.fbApplied = '1';
    img.addEventListener('error', function() {
      var s = this.getAttribute('src') || '';
      if (!s || s.startsWith('data:')) return;
      if (!this.dataset.fbStep) {
        this.dataset.fbStep = '1';
        var m = s.startsWith('/l5e/') ? s.replace('/l5e/', '/__l5e/') : s;
        this.src = 'https://frigobarmondialshop.lovable.app' + m;
      } else if (this.dataset.fbStep === '1') {
        this.dataset.fbStep = '2';
        this.src = 'https://raw.githubusercontent.com/detudosshop-dotcom/frigobarmondial/main' + s;
      }
    });
  }
  function scan() {
    document.querySelectorAll('img').forEach(fixImg);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scan);
  } else {
    scan();
  }
  try {
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  } catch(e){}
})();
</script>
